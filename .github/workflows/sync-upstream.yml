name: Sync upstream and publish Mihomo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "custom/**"
      - "tests/**"
      - "package*.json"
      - "Script/mihomoScript.js"
      - "mihomoScript.js"
  schedule:
    - cron: "0 5,11,17,23 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-mihomo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the triggering source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve the published acceptance baseline
        run: |
          mkdir -p .build
          cp mihomoScript.js .build/previous.mihomo.js
          cp custom/upstream.json .build/previous.report.json

      - name: Merge upstream history and restore the complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AIsouler/MyClash.git
          git fetch --no-tags upstream main
          git merge --no-commit --no-ff --strategy=ours refs/remotes/upstream/main
          git restore --source=refs/remotes/upstream/main --staged --worktree -- Script/mihomoScript.js LICENSE
          git diff --exit-code refs/remotes/upstream/main -- Script/mihomoScript.js LICENSE
          git branch -f upstream refs/remotes/upstream/main

      - name: Set up the build-only Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install locked build and Bettbox validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f package-lock.json; then npm install --package-lock-only --ignore-scripts; fi
          npm ci --ignore-scripts --no-audit --no-fund
          if ! test -f tests/bettbox-runner/Cargo.lock; then cargo generate-lockfile --manifest-path tests/bettbox-runner/Cargo.toml; fi
          cargo build --release --locked --manifest-path tests/bettbox-runner/Cargo.toml

      - name: Pin and install the Mihomo validation release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api repos/MetaCubeX/mihomo/releases/latest)"
          mihomo_version="$(jq --raw-output '.tag_name' <<< "${release_json}")"
          asset="mihomo-linux-amd64-compatible-${mihomo_version}.gz"
          asset_json="$(jq --compact-output --arg name "${asset}" '.assets[] | select(.name == $name)' <<< "${release_json}")"
          download_url="$(jq --raw-output '.browser_download_url' <<< "${asset_json}")"
          digest="$(jq --raw-output '.digest' <<< "${asset_json}")"
          if [[ -z "${asset_json}" || "${digest}" != sha256:* ]]; then
            echo "Release asset or SHA-256 digest missing." >&2
            exit 1
          fi
          archive="${RUNNER_TEMP}/${asset}"
          curl --fail --location --silent --show-error "${download_url}" --output "${archive}"
          echo "${digest#sha256:}  ${archive}" | sha256sum --check
          gzip --decompress --stdout "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod +x "${RUNNER_TEMP}/mihomo"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          export MIHOMO_VERSION="${mihomo_version}" MIHOMO_DIGEST="${digest}"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import {createHash} from "node:crypto";
          const cargo = fs.readFileSync("tests/bettbox-runner/Cargo.lock");
          const validation = {
            mihomo: {version: process.env.MIHOMO_VERSION, archive_sha256: process.env.MIHOMO_DIGEST.slice(7)},
            bettbox: {reference: "v1.19.7", rquickjs: "0.12.2", cargo_lock_sha256: createHash("sha256").update(cargo).digest("hex")}
          };
          fs.writeFileSync(".build/validation.json", JSON.stringify(validation, null, 2) + "\n");
          JS
          "${RUNNER_TEMP}/mihomo" -v

      - name: Capture all generation inputs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: node custom/snapshot.mjs

      - name: Generate entirely from source
        run: |
          rm mihomoScript.js
          node custom/build_mihomo_script.mjs

      - name: Validate builder behavior
        run: npm test

      - name: Generate the configuration with the Bettbox engine and verify retained policy
        env:
          BETTBOX_RUNNER: ${{ github.workspace }}/tests/bettbox-runner/target/release/bettbox-script-check
          BASELINE_SCRIPT: ${{ github.workspace }}/.build/previous.mihomo.js
          BASELINE_REPORT: ${{ github.workspace }}/.build/previous.report.json
        run: |
          node tests/validate_mihomo_script.mjs .build/mihomo-fixture.json

      - name: Validate generated Mihomo configuration
        run: mihomo -t -f .build/mihomo-fixture.json

      - name: Verify regeneration from the same fixed snapshot
        run: |
          node custom/build_mihomo_script.mjs --check
          git diff --check
          git diff --cached --check

      - name: Publish the validated source lock, output, and upstream mirror
        shell: bash
        run: |
          set -euo pipefail
          git add -- Script/mihomoScript.js LICENSE mihomoScript.js custom/upstream.json custom/sources.lock.json package-lock.json tests/bettbox-runner/Cargo.lock
          if test -f "$(git rev-parse --git-path MERGE_HEAD)" || ! git diff --cached --quiet; then
            git commit -m "chore: publish validated Mihomo build from fixed inputs"
          fi
          git merge-base --is-ancestor refs/remotes/upstream/main HEAD
          git push --atomic origin HEAD:refs/heads/main refs/heads/upstream:refs/heads/upstream

      - name: Remove downloaded validator
        if: always()
        run: rm -f "${RUNNER_TEMP}"/mihomo "${RUNNER_TEMP}"/mihomo-*.gz
