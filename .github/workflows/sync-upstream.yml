name: Publish Mihomo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-upstream.yml"
      - "custom/**"
      - "package*.json"
  schedule:
    - cron: "0 5,11,17,23 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-mihomo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Fetch, customize, and publish
        shell: bash
        run: |
          set -euo pipefail
          upstream_dir="$(mktemp -d)"
          trap 'rm -rf -- "$upstream_dir"' EXIT
          curl --fail --silent --show-error --location \
            "https://codeload.github.com/AIsouler/MyClash/tar.gz/refs/heads/main" |
            tar --extract --gzip --directory "$upstream_dir" --strip-components=1 --wildcards \
              '*/Script/mihomoScript.js' '*/Config/mihomoConfig.yaml' '*/LICENSE'
          npm ci --ignore-scripts --no-audit --no-fund --silent
          UPSTREAM_DIR="$upstream_dir" node custom/build_mihomo_script.mjs
          if git diff --quiet -- mihomoScript.js LICENSE; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mihomoScript.js LICENSE
          git commit --quiet -m "chore: publish customized upstream Mihomo script"
          git push --quiet origin HEAD:refs/heads/main
